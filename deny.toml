[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Build-time-only transitive deps of `ksni 0.2 -> dbus-codegen -> clap 2`
    # in `ui/Cargo.lock` (never linked into the runtime `dboard-tray` binary).
    "RUSTSEC-2021-0139", # ansi_term unmaintained
    "RUSTSEC-2024-0375", # atty unmaintained
    "RUSTSEC-2021-0145", # atty Windows-only unsoundness
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]