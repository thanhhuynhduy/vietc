[package]
name = "vietc-daemon"
version.workspace = true
edition.workspace = true
description = "VietC pure evdev background daemon"
license.workspace = true

[[bin]]
name = "vietc"
path = "src/main.rs"

[features]
default = ["x11", "wayland"]
x11 = ["vietc-protocol/x11"]
wayland = ["vietc-protocol/wayland-protocol", "dep:wayland-client", "dep:cosmic-protocols", "dep:wayland-protocols"]

[dependencies]
vietc-engine.workspace = true
vietc-protocol.workspace = true
toml = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13.2"
libc = "0.2"
dirs = "7.0.0"
dbus = "0.9"
wayland-client = { version = "0.31", optional = true }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"

[dev-dependencies]
tempfile = "3"
tungstenite = "0.30.0"
