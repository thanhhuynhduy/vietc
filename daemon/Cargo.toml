[package]
name = "vietc-daemon"
version = "0.1.24"
edition = "2021"
description = "Viet+ background daemon"
license = "MIT"

[[bin]]
name = "vietc"
path = "src/main.rs"

[features]
default = ["x11", "wayland"]
x11 = ["vietc-protocol/x11"]
wayland = ["vietc-protocol/wayland-protocol", "dep:wayland-client", "dep:wayland-protocols-misc", "dep:xkbcommon", "dep:cosmic-protocols", "dep:wayland-protocols"]

[dependencies]
vietc-engine = { path = "../engine" }
vietc-protocol = { path = "../protocol" }
toml = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13"
libc = "0.2"
dirs = "7"
dbus = "0.9"
wayland-client = { version = "0.31", optional = true }
wayland-protocols-misc = { version = "0.3", optional = true, features = ["client"] }
xkbcommon = { version = "0.9", optional = true }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"

[dev-dependencies]
tempfile = "3"
tungstenite = "0.30"
