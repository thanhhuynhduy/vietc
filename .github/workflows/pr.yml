name: Pull Request Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Format, Clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libevdev-dev libwayland-dev libx11-dev libxtst-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path ui/Cargo.toml --all -- --check

      - name: Enforce Rust source-size and installer security checks
        run: |
          python3 scripts/check_source_size.py
          python3 scripts/test_installer.py
          python3 scripts/test_build_targets.py
          bash -n install.sh uninstall.sh packaging/release.sh packaging/build-tarball.sh packaging/deb/build-deb.sh

      - name: Run Clippy
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY -u DBOARD_RUNTIME_TESTS -u DBOARD_CONTROLLED_DISPLAY cargo clippy --workspace --all-targets --all-features -- -D warnings
          env -u DISPLAY -u WAYLAND_DISPLAY -u DBOARD_RUNTIME_TESTS -u DBOARD_CONTROLLED_DISPLAY cargo clippy --manifest-path ui/Cargo.toml --all-targets -- -D warnings

      - name: Run headless workspace and UI tests
        run: make test-ci-smoke CARGO_FLAGS=--locked