name: Headless quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint production Rust code
        run: cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings
      - name: Check all workspace targets
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Run deterministic regression suites
        run: make test-ci-smoke
      - name: Check tray and run headless tray regressions
        run: cargo test --manifest-path ui/Cargo.toml --locked
