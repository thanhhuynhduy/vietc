name: Supply Chain Security

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "31 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit, licenses, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx

      - name: Check known vulnerabilities
        run: cargo audit --deny warnings

      - name: Check licenses, sources, and duplicate dependencies
        run: cargo deny check

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist
          cargo cyclonedx --format json --override-filename vietc.cdx
          find . -maxdepth 3 -type f -name 'vietc.cdx.json' -exec cp {} dist/ \;
          test -s dist/vietc.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: vietc-sbom-${{ github.sha }}
          path: dist/vietc.cdx.json
          if-no-files-found: error
          retention-days: 90