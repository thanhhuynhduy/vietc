name: Supply Chain Security

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "31 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit, licenses, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx

      - name: Check known vulnerabilities
        run: |
          cargo audit --deny warnings
          cargo audit --file ui/Cargo.lock --deny warnings \
            --ignore RUSTSEC-2021-0139 \
            --ignore RUSTSEC-2024-0375 \
            --ignore RUSTSEC-2021-0145

      - name: Check licenses, sources, and duplicate dependencies
        run: |
          cargo deny check
          cargo deny --manifest-path ui/Cargo.toml check

      - name: Generate CycloneDX SBOM per crate
        run: |
          mkdir -p dist
          cargo cyclonedx --format json
          cargo cyclonedx --manifest-path ui/Cargo.toml --format json
          find . -maxdepth 3 -type f -name '*.cdx.json' -exec mv -f {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.cdx.json' -print -quit)"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: dboard-sbom-${{ github.sha }}
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 90