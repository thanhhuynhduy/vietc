name: Stable Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot libdbus-1-dev libevdev-dev libwayland-dev libx11-dev libxtst-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path ui/Cargo.toml --all -- --check

      - name: Run Clippy
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          env -u DISPLAY -u WAYLAND_DISPLAY cargo clippy --manifest-path ui/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run headless CI smoke suite
        run: make test-ci-smoke CARGO_FLAGS=--locked

      - name: Build release artifacts
        run: make release

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          find . -maxdepth 4 -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"

      - name: Generate build metadata
        run: |
          {
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "channel=stable"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > dist/BUILD-METADATA

      - name: Generate checksums and release evidence
        env:
          RELEASE_CHANNEL: stable
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          bash scripts/generate-release-evidence.sh dist/RELEASE-EVIDENCE.md
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*